name: Validate and publish proof wiki

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
        env:
          BASE_PATH: /eth-proof-wiki/
      - name: Verify root-path build also works
        run: |
          BASE_PATH=/ node -e "import('./scripts/build.mjs').then(m=>m.build({output:'public-root'}))"
          OUTPUT=public-root node scripts/check-links.mjs
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Desktop and mobile browser regression checks
        run: |
          npm run preview > /tmp/proof-wiki-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/eth-proof-wiki/ > /dev/null; then break; fi
            sleep 1
          done
          python tests/browser-smoke.py
        env:
          CI: 'true'
      - name: Upload only reviewed static output
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check existing Pages configuration
        uses: actions/configure-pages@v5
        # First-time enablement is intentionally not attempted with GITHUB_TOKEN.
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
